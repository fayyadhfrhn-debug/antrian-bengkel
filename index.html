<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display Antrian Bengkel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      /* Jarak aman 25px dari bingkai TV agar tidak terpotong (overscan) */
      padding: 25px !important; 
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Container Utama Layout Display TV */
    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 20px;
    }

    /* Header: Menampilkan Informasi Hari, Tanggal, dan Cuaca */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #1e293b;
      color: #ffffff;
      padding: 15px 25px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .header-title {
      font-size: 1.8rem;
      font-weight: bold;
    }

    .header-info {
      display: flex;
      gap: 20px;
      font-size: 1.2rem;
    }

    /* Konten Antrian */
    .content {
      display: flex;
      flex: 1;
      gap: 20px;
    }

    .main-display {
      flex: 2;
      background: #ffffff;
      border-radius: 12px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .main-display h2 {
      font-size: 2rem;
      color: #64748b;
      margin-bottom: 10px;
    }

    .current-number {
      font-size: 6rem;
      font-weight: bold;
      color: #2563eb;
    }

    .current-loket {
      font-size: 2.5rem;
      color: #0f172a;
      margin-top: 10px;
    }

    .sidebar-queue {
      flex: 1;
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }

    .sidebar-queue h3 {
      font-size: 1.5rem;
      margin-bottom: 15px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
    }

    .queue-list {
      list-style: none;
    }

    .queue-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 1.2rem;
    }

    /* Footer / Running Text */
    footer {
      background: #2563eb;
      color: white;
      padding: 12px;
      border-radius: 8px;
      font-size: 1.2rem;
      white-space: nowrap;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header Informasi -->
    <header>
      <div class="header-title">BENGKEL MOTOR MAJU JAYA</div>
      <div class="header-info">
        <span id="hari-tanggal">Minggu, 13 September 2026</span>
        <span id="widget-cuaca">Cerah 30°C</span>
      </div>
    </header>

    <!-- Display Utama Antrian -->
    <div class="content">
      <div class="main-display">
        <h2>NOMOR ANTRIAN</h2>
        <div class="current-number" id="nomor-sekarang">A-005</div>
        <div class="current-loket" id="loket-sekarang">LOKET / PIT 1</div>
      </div>

      <!-- Daftar Antrian Selanjutnya -->
      <div class="sidebar-queue">
        <h3>ANTRIAN SELANJUTNYA</h3>
        <ul class="queue-list" id="daftar-antrian">
          <li class="queue-item"><span>A-006</span> <span>Servis Rutin</span></li>
          <li class="queue-item"><span>A-007</span> <span>Ganti Oli</span></li>
          <li class="queue-item"><span>A-008</span> <span>Tune Up</span></li>
        </ul>
      </div>
    </div>

    <!-- Running Text Informasi -->
    <footer>
      <marquee behavior="scroll" direction="left">Selamat datang di Bengkel Maju Jaya — Harap menunggu nomor antrian Anda dipanggil — Utamakan Keselamatan Berkendara</marquee>
    </footer>
  </div>

  <script>
    // Contoh Skrip Update Waktu / Data jika diperlukan
    function updateWaktu() {
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const sekarang = new Date().toLocaleDateString('id-ID', options);
      document.getElementById('hari-tanggal').innerText = sekarang;
    }

    updateWaktu();
  </script>

</body>
</html>
